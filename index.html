<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAÍZA FINANÇAS — Versão Atualizada</title>

<style>
:root {
  --azul: #173f8a;
  --azul2: #2563eb;
  --verde: #16a34a;
  --vermelho: #dc2626;
  --amarelo: #d97706;
  --bg: #f8fafc;
  --texto: #1f2937;
  --borda: #e2e8f0;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--texto);
  display: flex;
  min-height: 100vh;
}

/* MENU LATERAL VERTICAL */
aside.sidebar {
  width: 250px;
  background: linear-gradient(180deg, var(--azul), #0f2a5e);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 20px 10px;
  flex-shrink: 0;
}

aside.sidebar h1 {
  font-size: 18px;
  margin: 0 0 5px 10px;
  color: #fff;
}

aside.sidebar p {
  font-size: 12px;
  margin: 0 0 20px 10px;
  opacity: 0.8;
}

.nav-vertical {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.btn-aba {
  padding: 12px 15px;
  background: transparent;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  color: #cbd5e1;
  cursor: pointer;
  text-align: left;
  font-size: 14px;
  transition: all 0.2s;
}

.btn-aba:hover, .btn-aba.active {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  border-left: 4px solid #38bdf8;
}

/* CONTEÚDO PRINCIPAL */
main.main-content {
  flex: 1;
  padding: 25px;
  overflow-y: auto;
}

.container {
  max-width: 850px;
  margin: 0 auto;
}

.conteudo-aba { display: none; }
.conteudo-aba.active { display: block; }

/* PAINÉIS DE RESUMO */
.resumo {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.card-resumo {
  background: #fff;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  border: 1px solid var(--borda);
}

.card-resumo span { display: block; font-size: 12px; color: #64748b; margin-bottom: 5px; }
.card-resumo strong { font-size: 15px; }

.val-total { color: var(--azul); }
.val-pago { color: var(--verde); }
.val-pendente { color: var(--amarelo); }
.val-entrada { color: var(--verde); }
.val-saida { color: var(--vermelho); }
.val-saldo { color: var(--azul2); }

/* CARDS E FORMULÁRIOS */
