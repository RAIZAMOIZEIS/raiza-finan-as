<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAÍZA FINANÇAS — Controle de Contas do Mês</title>
<style>
:root{
  --azul:#173f8a;
  --azul2:#2563eb;
  --verde:#16a34a;
  --vermelho:#dc2626;
  --amarelo:#d97706;
  --bg:#f8fafc;
  --texto:#1f2937;
  --borda:#e2e8f0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--texto);
}
header{
  background:linear-gradient(120deg,var(--azul),var(--azul2));
  color:#fff;
  padding:20px;
  text-align:center;
}
header h1{margin:0;font-size:22px;}
header p{margin:5px 0 0;font-size:14px;opacity:0.9;}

.container{
  max-width:700px;
  margin:20px auto;
  padding:0 15px;
}

/* RESUMO DO MÊS */
.resumo{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}
.card-resumo{
  background:#fff;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.05);
  border:1px solid var(--borda);
}
.card-resumo span{display:block;font-size:12px;color:#64748b;margin-bottom:5px;}
.card-resumo strong{font-size:15px;}
.val-total{color:var(--azul);}
.val-pago{color:var(--verde);}
.val-pendente{color:var(--amarelo);}

/* CARDS E FORMULÁRIO */
.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 5px rgba(0,0,0,0.05);
  border:1px solid var(--borda);
  margin-bottom:20px;
}
h3{margin-top:0;font-size:18px;color:var(--azul);}

.form-grid{
  display:grid;
  grid-template-columns: 2fr 1fr 1fr auto;
  gap:10px;
  align-items:end;
}
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr;}
}

label{font-size:12px;font-weight:bold;display:block;margin-bottom:4px;color:#475569;}
input, select{
  width:100%;
  padding:10px;
  border:1px solid var(--borda);
  border-radius:8px;
  font:inherit;
}
button.btn{
  width:100%;
  padding:10px 15px;
  background:var(--azul2);
  color:#fff;
  border:0;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  height:42px;
}
button.btn:hover{background:var(--azul);}

/* LISTA DE CONTAS */
.conta-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--borda);
}
.conta-item:last-child{border-bottom:0;}
.conta-info strong{display:block;font-size:15px;}
.conta-info small{color:#64748b;}

.acoes{
  display:flex;
  align-items:center;
  gap:10px;
}

/* STATUS TAGS / BOTÕES */
.badge{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  border:0;
  cursor:pointer;
}
.badge.pendente{
  background:#fef3c7;
  color:#92400e;
}
.badge.pago{
  background:#dcfce7;
  color:#166534;
}
.badge.pendente:hover{background:#fde68a;}
.badge.pago:hover{background:#bbf7d0;}

.btn-apagar{
  background:transparent;
  color:#94a3b8;
  border:0;
  cursor:pointer;
  font-size:16px;
  padding:4px;
}
.btn-apagar:hover{color:var(--vermelho);}
</style>
</head>
<body>

<header>
  <h1>📈 RAÍZA FINANÇAS</h1>
  <p>Painel de Controle de Contas do Mês</p>
</header>

<div class="container">

  <!-- RESUMO DO MÊS -->
  <div class="resumo">
    <div class="card-resumo">
      <span>Total do Mês</span>
      <strong class="val-total" id="valTotal">R$ 0,00</strong>
    </div>
    <div class="card-resumo">
      <span>Já Pago</span>
      <strong class="val-pago" id="valPago">R$ 0,00</strong>
    </div>
    <div class="card-resumo">
      <span>Falta Pagar</span>
      <strong class="val-pendente" id="valPendente">R$ 0,00</strong>
    </div>
  </div>

  <!-- CADASTRAR CONTA -->
  <div class="card">
    <h3>➕ Adicionar Conta do Mês</h3>
    <div class="form-grid">
      <div>
        <label>Descrição da Conta</label>
        <input type="text" id="desc" placeholder="Ex: Aluguel, Luz, Internet...">
      </div>
      <div>
        <label>Valor (R$)</label>
        <input type="number" step="0.01" id="valor" placeholder="0.00">
      </div>
      <div>
        <label>Status Inicial</label>
        <select id="status">
          <option value="pendente">Pendente ⏳</option>
          <option value="pago">Pago ✅</option>
        </select>
      </div>
      <div>
        <button class="btn" onclick="adicionarConta()">Adicionar</button>
      </div>
    </div>
  </div>

  <!-- LISTA DE CONTAS -->
  <div class="card">
    <h3>📋 Minhas Contas</h3>
    <div id="listaContas">
      <p style="color:#64748b;text-align:center;font-size:14px;">Nenhuma conta cadastrada para este mês.</p>
    </div>
  </div>

</div>

<script>
// Carregar dados salvos ou iniciar lista vazia
let contas = JSON.parse(localStorage.getItem('raiza_contas_mes')) || [];

function formatarMoeda(valor) {
  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function atualizarPainel() {
  const listaEl = document.getElementById('listaContas');
  listaEl.innerHTML = '';

  let totalGeral = 0;
  let totalPago = 0;
  let totalPendente = 0;

  if (contas.length === 0) {
    listaEl.innerHTML = '<p style="color:#64748b;text-align:center;font-size:14px;">Nenhuma conta cadastrada para este mês.</p>';
  }

  contas.forEach((c, index) => {
    totalGeral += c.valor;
    if (c.status === 'pago') {
      totalPago += c.valor;
    } else {
      totalPendente += c.valor;
    }

    const div = document.createElement('div');
    div.className = 'conta-item';
    div.innerHTML = `
      <div class="conta-info">
        <strong>${c.desc}</strong>
        <small>${formatarMoeda(c.valor)}</small>
      </div>
      <div class="acoes">
        <button class="badge ${c.status}" onclick="alternarStatus(${index})" title="Clique para alterar status">
          ${c.status === 'pago' ? '✅ Pago' : '⏳ Pendente'}
        </button>
        <button class="btn-apagar" onclick="removerConta(${index})" title="Excluir conta">🗑️</button>
      </div>
    `;
    listaEl.appendChild(div);
  });

  document.getElementById('valTotal').textContent = formatarMoeda(totalGeral);
  document.getElementById('valPago').textContent = formatarMoeda(totalPago);
  document.getElementById('valPendente').textContent = formatarMoeda(totalPendente);

  // Salvar no navegador
  localStorage.setItem('raiza_contas_mes', JSON.stringify(contas));
}

function adicionarConta() {
  const desc = document.getElementById('desc').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const status = document.getElementById('status').value;

  if (!desc || isNaN(valor) || valor <= 0) {
    alert('Por favor, informe a descrição e um valor válido.');
    return;
  }

  contas.push({ desc, valor, status });

  // Limpar campos
  document.getElementById('desc').value = '';
  document.getElementById('valor').value = '';
  document.getElementById('status').value = 'pendente';

  atualizarPainel();
}

function alternarStatus(index) {
  // Alterna entre pago e pendente com um clique no botão de status
  if (contas[index].status === 'pendente') {
    contas[index].status = 'pago';
  } else {
    contas[index].status = 'pendente';
  }
  atualizarPainel();
}

function removerConta(index) {
  if (confirm('Deseja realmente excluir esta conta?')) {
    contas.splice(index, 1);
    atualizarPainel();
  }
}

// Inicializar aplicativo
atualizarPainel();
</script>

</body>
</html>
