<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAÍZA FINANÇAS — Contas a Pagar</title>
<style>
:root{
  --azul:#173f8a;
  --azul2:#2563eb;
  --verde:#16a34a;
  --vermelho:#dc2626;
  --amarelo:#d97706;
  --bg:#f8fafc;
  --texto:#1f2937;
  --borda:#e2e8f0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--texto);
}
header{
  background:linear-gradient(120deg,var(--azul),var(--azul2));
  color:#fff;
  padding:20px;
  text-align:center;
}
header h1{margin:0;font-size:22px;}
header p{margin:5px 0 0;font-size:14px;opacity:0.9;}

.container{
  max-width:700px;
  margin:20px auto;
  padding:0 15px;
}

/* ABAS DE NAVEGAÇÃO */
.nav-abas{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}
.btn-aba{
  flex:1;
  padding:12px;
  background:#fff;
  border:1px solid var(--borda);
  border-radius:10px;
  font-weight:bold;
  color:var(--texto);
  cursor:pointer;
  text-align:center;
}
.btn-aba.active{
  background:var(--azul);
  color:#fff;
  border-color:var(--azul);
}

.conteudo-aba{
  display:none;
}
.conteudo-aba.active{
  display:block;
}

/* RESUMO */
.resumo{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}
.card-resumo{
  background:#fff;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.05);
  border:1px solid var(--borda);
}
.card-resumo span{display:block;font-size:12px;color:#64748b;margin-bottom:5px;}
.card-resumo strong{font-size:15px;}
.val-total{color:var(--azul);}
.val-pago{color:var(--verde);}
.val-pendente{color:var(--amarelo);}

/* CARDS E FORMULÁRIO */
.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 5px rgba(0,0,0,0.05);
  border:1px solid var(--borda);
  margin-bottom:20px;
}
h3{margin-top:0;font-size:18px;color:var(--azul);}

label{font-size:12px;font-weight:bold;display:block;margin-top:10px;color:#475569;}
input, select{
  width:100%;
  padding:10px;
  margin-top:4px;
  border:1px solid var(--borda);
  border-radius:8px;
  font:inherit;
}
button.btn{
  width:100%;
  padding:12px;
  background:var(--azul2);
  color:#fff;
  border:0;
  border-radius:8px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}
button.btn:hover{background:var(--azul);}

/* LISTA */
.conta-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid var(--borda);
}
.conta-item:last-child{border-bottom:0;}
.conta-info strong{display:block;font-size:15px;}
.conta-info small{color:#64748b;}

.acoes{
  display:flex;
  align-items:center;
  gap:10px;
}

.badge{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  border:0;
  cursor:pointer;
}
.badge.pendente{
  background:#fef3c7;
  color:#92400e;
}
.badge.pago{
  background:#dcfce7;
  color:#166534;
}

.btn-apagar{
  background:transparent;
  color:#94a3b8;
  border:0;
  cursor:pointer;
  font-size:16px;
  padding:4px;
}
.btn-apagar:hover{color:var(--vermelho);}
</style>
</head>
<body>

<header>
  <h1>📈 RAÍZA FINANÇAS</h1>
  <p>Controle Inteligente de Contas</p>
</header>

<div class="container">

  <!-- ABAS DE NAVEGAÇÃO -->
  <div class="nav-abas">
    <button class="btn-aba active" onclick="mudarAba('pagar', this)">📅 Contas a Pagar</button>
    <button class="btn-aba" onclick="mudarAba('novo', this)">➕ Adicionar Conta</button>
  </div>

  <!-- ABA: CONTAS A PAGAR -->
  <div id="aba-pagar" class="conteudo-aba active">
    
    <!-- RESUMO -->
    <div class="resumo">
      <div class="card-resumo">
        <span>Total Geral</span>
        <strong class="val-total" id="valTotal">R$ 0,00</strong>
      </div>
      <div class="card-resumo">
        <span>Já Pago</span>
        <strong class="val-pago" id="valPago">R$ 0,00</strong>
      </div>
      <div class="card-resumo">
        <span>Pendente</span>
        <strong class="val-pendente" id="valPendente">R$ 0,00</strong>
      </div>
    </div>

    <div class="card">
      <h3>📋 Lista de Contas do Mês</h3>
      <div id="listaContas">
        <p style="color:#64748b;text-align:center;font-size:14px;">Nenhuma conta cadastrada.</p>
      </div>
    </div>

  </div>

  <!-- ABA: ADICIONAR CONTA -->
  <div id="aba-novo" class="conteudo-aba">
    <div class="card">
      <h3>➕ Nova Conta a Pagar</h3>
      
      <label>Nome da Conta (ex: Aluguel, Luz, Cartão)</label>
      <input type="text" id="desc" placeholder="Ex: Internet">

      <label>Valor (R$)</label>
      <input type="number" step="0.01" id="valor" placeholder="0.00">

      <label>Data de Vencimento</label>
      <input type="date" id="vencimento">

      <label>Status Inicial</label>
      <select id="status">
        <option value="pendente">Pendente ⏳</option>
        <option value="pago">Pago ✅</option>
      </select>

      <button class="btn" onclick="adicionarConta()">Salvar Conta</button>
    </div>
  </div>

</div>

<script>
let contas = JSON.parse(localStorage.getItem('raiza_contas_pagar')) || [];

function mudarAba(abaId, btn) {
  document.querySelectorAll('.conteudo-aba').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.btn-aba').forEach(el => el.classList.remove('active'));

  document.getElementById('aba-' + abaId).classList.add('active');
  btn.classList.add('active');
}

function formatarMoeda(valor) {
  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function formatarData(dataIso) {
  if (!dataIso) return '';
  const partes = dataIso.split('-');
  return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function atualizarPainel() {
  const listaEl = document.getElementById('listaContas');
  listaEl.innerHTML = '';

  let totalGeral = 0;
  let totalPago = 0;
  let totalPendente = 0;

  if (contas.length === 0) {
    listaEl.innerHTML = '<p style="color:#64748b;text-align:center;font-size:14px;">Nenhuma conta cadastrada.</p>';
  }

  contas.forEach((c, index) => {
    totalGeral += c.valor;
    if (c.status === 'pago') {
      totalPago += c.valor;
    } else {
      totalPendente += c.valor;
    }

    const div = document.createElement('div');
    div.className = 'conta-item';
    div.innerHTML = `
      <div class="conta-info">
        <strong>${c.desc}</strong>
        <small>${c.vencimento ? 'Vencimento: ' + formatarData(c.vencimento) + ' — ' : ''}${formatarMoeda(c.valor)}</small>
      </div>
      <div class="acoes">
        <button class="badge ${c.status}" onclick="alternarStatus(${index})" title="Clique para alternar status">
          ${c.status === 'pago' ? '✅ Pago' : '⏳ Pendente'}
        </button>
        <button class="btn-apagar" onclick="removerConta(${index})" title="Excluir">🗑️</button>
      </div>
    `;
    listaEl.appendChild(div);
  });

  document.getElementById('valTotal').textContent = formatarMoeda(totalGeral);
  document.getElementById('valPago').textContent = formatarMoeda(totalPago);
  document.getElementById('valPendente').textContent = formatarMoeda(totalPendente);

  localStorage.setItem('raiza_contas_pagar', JSON.stringify(contas));
}

function adicionarConta() {
  const desc = document.getElementById('desc').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);
  const vencimento = document.getElementById('vencimento').value;
  const status = document.getElementById('status').value;

  if (!desc || isNaN(valor) || valor <= 0) {
    alert('Por favor, preencha o nome da conta e um valor válido.');
    return;
  }

  contas.push({ desc, valor, vencimento, status });

  // Limpar campos
  document.getElementById('desc').value = '';
  document.getElementById('valor').value = '';
  document.getElementById('vencimento').value = '';
  document.getElementById('status').value = 'pendente';

  // Voltar para a aba de listagem automaticamente
  mudarAba('pagar', document.querySelector('.btn-aba'));
  atualizarPainel();
}

function alternarStatus(index) {
  contas[index].status = contas[index].status === 'pendente' ? 'pago' : 'pendente';
  atualizarPainel();
}

function removerConta(index) {
  if (confirm('Deseja realmente excluir esta conta?')) {
    contas.splice(index, 1);
    atualizarPainel();
  }
}

// Inicializar
atualizarPainel();
</script>

</body>
</html>
