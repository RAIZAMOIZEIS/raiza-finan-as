<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAÍZA FINANÇAS — Controle Real</title>
<style>
:root{
  --azul:#173f8a;
  --azul2:#2563eb;
  --verde:#16a34a;
  --vermelho:#dc2626;
  --bg:#f8fafc;
  --texto:#1f2937;
  --borda:#e2e8f0;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--texto);
}
header{
  background:linear-gradient(120deg,var(--azul),var(--azul2));
  color:#fff;
  padding:20px;
  text-align:center;
}
header h1{margin:0;font-size:22px;}
header p{margin:5px 0 0;font-size:14px;opacity:0.9;}

.container{
  max-width:600px;
  margin:20px auto;
  padding:0 15px;
}

/* CARDS DE RESUMO */
.resumo{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:20px;
}
.card-resumo{
  background:#fff;
  padding:15px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.05);
  border:1px solid var(--borda);
}
.card-resumo span{display:block;font-size:12px;color:#64748b;margin-bottom:5px;}
.card-resumo strong{font-size:16px;}
.val-entrada{color:var(--verde);}
.val-saida{color:var(--vermelho);}
.val-saldo{color:var(--azul2);}

/* FORMULÁRIO E LISTAS */
.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 5px rgba(0,0,0,0.05);
  border:1px solid var(--borda);
  margin-bottom:20px;
}
h3{margin-top:0;font-size:18px;color:var(--azul);}

label{font-size:13px;font-weight:bold;display:block;margin-top:10px;}
input, select{
  width:100%;
  padding:10px;
  margin-top:5px;
  border:1px solid var(--borda);
  border-radius:8px;
  font:inherit;
}
button.btn{
  width:100%;
  padding:12px;
  background:var(--azul2);
  color:#fff;
  border:0;
  border-radius:8px;
  font-weight:bold;
  margin-top:15px;
  cursor:pointer;
}
button.btn:hover{background:var(--azul);}

/* LISTA DE LANÇAMENTOS */
.transacao-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid var(--borda);
}
.transacao-item:last-child{border-bottom:0;}
.info-transacao small{color:#64748b;display:block;}
.btn-apagar{
  background:#fee2e2;
  color:var(--vermelho);
  border:0;
  padding:6px 10px;
  border-radius:6px;
  cursor:pointer;
  font-size:12px;
}
.btn-apagar:hover{background:#fecaca;}
</style>
</head>
<body>

<header>
  <h1>📈 RAÍZA FINANÇAS</h1>
  <p>Controle Financeiro Direto e Funcional</p>
</header>

<div class="container">

  <!-- RESUMO FINANCEIRO -->
  <div class="resumo">
    <div class="card-resumo">
      <span>Entradas</span>
      <strong class="val-entrada" id="totalEntrada">R$ 0,00</strong>
    </div>
    <div class="card-resumo">
      <span>Saídas</span>
      <strong class="val-saida" id="totalSaida">R$ 0,00</strong>
    </div>
    <div class="card-resumo">
      <span>Saldo</span>
      <strong class="val-saldo" id="totalSaldo">R$ 0,00</strong>
    </div>
  </div>

  <!-- FORMULÁRIO DE CADASTRO -->
  <div class="card">
    <h3>➕ Adicionar Movimentação</h3>
    
    <label>Tipo</label>
    <select id="tipo">
      <option value="entrada">Entrada (Receita) 🟢</option>
      <option value="saida">Saída (Despesa) 🔴</option>
    </select>

    <label>Descrição</label>
    <input type="text" id="descricao" placeholder="Ex: Salário, Aluguel, Supermercado...">

    <label>Valor (R$)</label>
    <input type="number" step="0.01" id="valor" placeholder="0.00">

    <button class="btn" onclick="adicionarTransacao()">Salvar Lançamento</button>
  </div>

  <!-- HISTÓRICO DE LANÇAMENTOS -->
  <div class="card">
    <h3>📋 Histórico de Contas</h3>
    <div id="listaTransacoes">
      <p style="color:#64748b;text-align:center;font-size:14px;">Nenhuma movimentação cadastrada.</p>
    </div>
  </div>

</div>

<script>
// Carregar dados salvos do navegador ou iniciar lista vazia
let transacoes = JSON.parse(localStorage.getItem('raiza_transacoes')) || [];

function formatarMoeda(valor) {
  return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function atualizarApp() {
  const listaEl = document.getElementById('listaTransacoes');
  listaEl.innerHTML = '';

  let totalEntrada = 0;
  let totalSaida = 0;

  if (transacoes.length === 0) {
    listaEl.innerHTML = '<p style="color:#64748b;text-align:center;font-size:14px;">Nenhuma movimentação cadastrada.</p>';
  }

  transacoes.forEach((t, index) => {
    if (t.tipo === 'entrada') {
      totalEntrada += t.valor;
    } else {
      totalSaida += t.valor;
    }

    const div = document.createElement('div');
    div.className = 'transacao-item';
    div.innerHTML = `
      <div class="info-transacao">
        <strong>${t.descricao}</strong>
        <small>${t.tipo === 'entrada' ? '🟢 Entrada' : '🔴 Saída'}</small>
      </div>
      <div>
        <span style="font-weight:bold; color:${t.tipo === 'entrada' ? 'var(--verde)' : 'var(--vermelho)'}; margin-right:10px;">
          ${t.tipo === 'entrada' ? '+' : '-'} ${formatarMoeda(t.valor)}
        </span>
        <button class="btn-apagar" onclick="removerTransacao(${index})">Excluir</button>
      </div>
    `;
    listaEl.appendChild(div);
  });

  let saldoTotal = totalEntrada - totalSaida;

  document.getElementById('totalEntrada').textContent = formatarMoeda(totalEntrada);
  document.getElementById('totalSaida').textContent = formatarMoeda(totalSaida);
  document.getElementById('totalSaldo').textContent = formatarMoeda(saldoTotal);

  // Salvar automaticamente na memória do navegador
  localStorage.setItem('raiza_transacoes', JSON.stringify(transacoes));
}

function adicionarTransacao() {
  const tipo = document.getElementById('tipo').value;
  const descricao = document.getElementById('descricao').value.trim();
  const valor = parseFloat(document.getElementById('valor').value);

  if (!descricao || isNaN(valor) || valor <= 0) {
    alert('Por favor, preencha a descrição e informe um valor válido.');
    return;
  }

  transacoes.push({ tipo, descricao, valor });
  
  // Limpar campos
  document.getElementById('descricao').value = '';
  document.getElementById('valor').value = '';

  atualizarApp();
}

function removerTransacao(index) {
  if (confirm('Deseja realmente apagar este lançamento?')) {
    transacoes.splice(index, 1);
    atualizarApp();
  }
}

// Inicializar na abertura da página
atualizarApp();
</script>

</body>
</html>
